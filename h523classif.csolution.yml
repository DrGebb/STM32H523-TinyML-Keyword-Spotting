# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR

  # Miscellaneous toolchain controls directly passed to the tools
  misc:
    - for-compiler: AC6 # change to -gdwarf-4 for debugging using uVision
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: Keil::STM32H5xx_DFP
    - pack: Keil::STM32H5xx_DFP@2.3.1
    - pack: ARM::CMSIS@6.1.0

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: STM32H523CETx
      device: STM32H523CETx
      processor:
        fpu: sp
        dsp: on
        mve: off

      target-set:
        - set:
          images:
            - project-context: h523classif.Release
          debugger:
            name: CMSIS-DAP@pyOCD
            clock: 10000000
            protocol: swd
  build-types:
    - type: Debug
      debug: on
      optimize: debug

    - type: Release
      debug: off
      optimize: balanced
      link-time-optimize: true

  # List related projects.
  projects:
    - project: ./h523classif/h523classif.cproject.yml
  compiler: AC6
